name: CI

# En cada push a una rama con Pull Request abierto, y en main.
#
# Lo que este archivo hace es REPORTAR. Lo que impide mergear cuando algo falla
# es una configuración aparte de GitHub:
#   Settings -> Branches -> Add rule -> Require status checks to pass
# Ahí hay que elegir el check "verificar".
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # La base, desde cero.
      #
      # Ésta es la razón de ser del job: la máquina de CI está vacía, así que
      # una migración que en la compu de alguien funciona sólo porque su base ya
      # tenía cierto estado —una columna agregada a mano en el Studio, un update
      # corrido una vez— acá revienta.
      #
      # No alcanza con un contenedor `postgres` pelado: tres migraciones
      # dependen del esquema de autenticación, que lo crean las migraciones de
      # GoTrue al arrancar el servicio.
      #
      #   0006_profesionales.sql    -> auth.users
      #   0007_seed_staff.sql       -> auth.users
      #   0011_rls_contra_staff.sql -> auth.uid()
      #
      # Se excluyen los servicios que no participan de ninguna verificación:
      # el sitio nunca habla con Supabase desde el navegador, así que alcanza
      # con la base, Auth y la API REST.
      # ─────────────────────────────────────────────────────────────────────
      # Sin `version:` a propósito: setup-cli la lee del lockfile.
      #
      # Antes acá decía `latest` y en tu máquina corrías `npx supabase`, que
      # baja la que haya. O sea que la herramienta que aplica las migraciones
      # podía ser una versión distinta en cada lado, y cambiar sola de un día
      # para el otro sin que nadie tocara nada.
      #
      # Es el mismo problema que `npm ci` resuelve para las dependencias, y se
      # resuelve igual: la versión vive en el lockfile y se mueve cuando alguien
      # decide moverla, en un commit que se ve.
      - uses: supabase/setup-cli@v3

      - name: Levantar la base y aplicar las migraciones
        run: |
          # Queda en el log a propósito. Cuando una migración se porta distinto
          # acá que en tu máquina, la primera pregunta es con qué CLI corrió, y
          # la action no lo dice. Tiene que coincidir con package.json.
          supabase --version
          supabase start -x studio,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,realtime,mailpit

      # `PageProps` y `LayoutProps` no están escritos en ningún lado: los genera
      # Next a partir de las rutas, en `.next/types/`, que está en .gitignore.
      # En una máquina que ya compiló alguna vez existen y `tsc` pasa; en una
      # limpia no, y fallaba con "Cannot find name 'PageProps'".
      #
      # Lo encontró la primera corrida de CI, que es exactamente para lo que está.
      - name: Generar los tipos de las rutas
        run: npx next typegen

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      # ─────────────────────────────────────────────────────────────────────
      # Las claves del stack que acabamos de levantar.
      #
      # Antes el build no necesitaba ninguna: todas las páginas eran
      # `force-dynamic` y nada tocaba la base al compilar. Desde que las de
      # catálogo se prerenderizan, el build las consulta, y sin variables falla
      # con "Faltan variables de entorno" al exportar /como-llegar.
      #
      # Se leen del CLI en vez de escribirlas acá. Son fijas y públicas —las
      # misma en toda máquina que corra `supabase start`, derivadas del JWT
      # secret público de la CLI, válidas sólo contra 127.0.0.1— pero un archivo
      # commiteado con `SUPABASE_SERVICE_ROLE_KEY:` y un valor al lado parece
      # una filtración aunque no lo sea, y enseña un patrón que el día que
      # alguien necesite una clave real va a repetir.
      #
      # Una clave de verdad iría como secreto de Actions (`${{ secrets.X }}`).
      # ─────────────────────────────────────────────────────────────────────
      - name: Tomar las claves del stack local
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # DEPLOY A PRODUCCIÓN
  #
  # Staging lo deploya Vercel solo al ver el merge; producción pasa por acá.
  # Eso convierte el pipeline de continuous deployment en continuous delivery:
  # todo lo que está en `main` PODRÍA ir a producción, pero va cuando una
  # persona lo aprueba.
  #
  # Tres cosas hacen que la compuerta sea real y no decorativa:
  #
  #   needs: verificar    no arranca si CI falló
  #   if: refs/heads/main sólo en merges, nunca en un PR. En un repo público
  #                       eso importa: un PR de un fork no tiene que poder
  #                       llegar ni cerca de estos secrets
  #   environment         tiene required reviewers, así que GitHub frena el job
  #                       y espera a que alguien apruebe
  #
  # Y requiere que el proyecto de producción tenga APAGADO el auto-deploy por
  # Git en Vercel. Si no, Vercel deploya al mergear y la aprobación llega tarde.
  # ───────────────────────────────────────────────────────────────────────────
  produccion:
    needs: verificar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://podologia-mitre-salta.vercel.app

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm i -g vercel@latest

      # Trae la configuración del proyecto y sus variables de entorno de
      # producción. Sin esto el build no sabe a qué Supabase apuntar.
      - name: Traer la config de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # El build corre ACÁ, no en Vercel. Es lo que nos devuelve el control del
      # orden: cuando metamos las migraciones, van antes de este paso.
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Que el deploy termine no significa que el sitio ande. Si esto falla, el
      # job queda en rojo y sabés que hay que volver atrás.
      - name: Smoke test
        run: |
          U=https://podologia-mitre-salta.vercel.app
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/turnos)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/no-existe)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/api/cron/retencion)" = "401"
          curl -s "$U/sitemap.xml" | grep -q "podologia-mitre-salta"
          echo "el sitio responde"
